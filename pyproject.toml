[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "esci-multimodel-ltr"
version = "0.1.0"
description = "Multi-stage multimodal product search ranking on Amazon ESCI"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=16",
    "zstandard>=0.22",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytrec-eval-terrier>=0.5.6",
]
baselines = [
    "sentence-transformers>=3.0",
    "torch>=2.4",
    "pillow>=10",
    # CrossEncoderTrainer needs both and sentence-transformers ships neither.
    # Without them the import succeeds and the first training step dies with
    # "Using the Trainer with PyTorch requires accelerate>=1.1.0".
    "datasets>=3.0",
    "accelerate>=1.1.0",
]
retrieval = [
    "bm25s>=0.3",
    "PyStemmer>=2.2",
    "openai>=1.40",
]
ranking = [
    "lightgbm>=4.5",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not data and not slow'"
markers = [
    "data: needs the real ESCI parquet on disk; opt in with -m data",
    "slow: takes more than a minute; opt in with -m slow",
]
